name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and verify plugin package
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build deterministic package
        run: python scripts/build_plugin.py
      - name: Verify ZIP and checksum
        shell: bash
        run: |
          unzip -t dist/BiblioSleuth-AI.zip
          cd dist
          sha256sum --check BiblioSleuth-AI.zip.sha256
