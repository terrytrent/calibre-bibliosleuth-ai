name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qlty:
    name: Qlty code-quality pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install pinned correctness linter
        run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Enforce correctness-oriented Ruff checks
        run: ruff check src tests scripts
      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
      - name: Run configured linters and security analyzers
        shell: bash
        run: |
          set -o pipefail
          qlty check --all --no-progress --no-fix --no-fail | tee qlty-check.txt
      - name: Collect maintainability metrics
        if: always()
        shell: bash
        run: |
          qlty smells --all | tee qlty-smells.txt || true
          qlty metrics --all --max-depth=2 --sort complexity --limit 50 | tee qlty-metrics.txt || true
      - name: Upload Qlty reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qlty-reports
          path: |
            qlty-check.txt
            qlty-smells.txt
            qlty-metrics.txt
          if-no-files-found: warn
          retention-days: 30
