name: tagged release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate tag and main ancestry
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Require tag and plugin versions to match
        id: version
        shell: bash
        run: |
          plugin_version="$(PYTHONPATH=src python -c 'from calibre_ai_plugin import BiblioSleuthAIPlugin; from calibre_ai_plugin.constants import PLUGIN_VERSION; assert BiblioSleuthAIPlugin.version == PLUGIN_VERSION; print(".".join(map(str, PLUGIN_VERSION)))')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$plugin_version" = "$tag_version"
          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: validate_tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - run: python -m pytest -q

  bandit:
    name: Bandit security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check bandit==1.9.4
      - name: Scan application and build code
        run: bandit --recursive --severity-level medium --confidence-level medium src/calibre_ai_plugin scripts

  dependencies:
    name: Python dependency vulnerability audit
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes --requirement requirements-runtime.txt

  codeql:
    name: CodeQL security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  trivy:
    name: Trivy security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          version: v0.74.0

  qlty:
    name: Qlty code-quality pass
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Enforce correctness-oriented Ruff checks
        run: ruff check src tests scripts
      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - run: qlty check --all --no-progress --no-fix --no-fail

  package:
    name: Build and verify release package
    needs: [validate_tag, tests, bandit, dependencies, codeql, trivy, qlty]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build deterministic package
        run: python scripts/build_plugin.py
      - name: Verify ZIP and checksum
        shell: bash
        run: |
          unzip -t dist/BiblioSleuth-AI.zip
          cd dist
          sha256sum --check BiblioSleuth-AI.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: BiblioSleuth AI-${{ needs.validate_tag.outputs.version }}
          path: |
            dist/BiblioSleuth-AI.zip
            dist/BiblioSleuth-AI.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [validate_tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: BiblioSleuth AI-${{ needs.validate_tag.outputs.version }}
          path: dist
      - name: Verify downloaded release assets
        run: cd dist && sha256sum --check BiblioSleuth-AI.zip.sha256
      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BiblioSleuth-AI.zip \
            dist/BiblioSleuth-AI.zip.sha256 \
            --verify-tag \
            --title "BiblioSleuth AI $RELEASE_VERSION" \
            --generate-notes
