name: tagged release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate tag and main ancestry
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Require tag and plugin versions to match
        id: version
        shell: bash
        run: |
          plugin_version="$(PYTHONPATH=src python -c 'from bibliosleuth_ai import BiblioSleuthAIPlugin; from bibliosleuth_ai.constants import PLUGIN_VERSION; assert BiblioSleuthAIPlugin.version == PLUGIN_VERSION; print(".".join(map(str, PLUGIN_VERSION)))')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$plugin_version" = "$tag_version"
          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: validate_tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - run: python -m pytest -q

  searxng-integration:
    name: Real SearXNG integration
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: make test-searxng

  local-model-integration:
    name: Local model (${{ matrix.runtime }})
    needs: validate_tag
    strategy:
      fail-fast: false
      matrix:
        runtime: [ollama, openai-compatible]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - env:
          LOCAL_MODEL_RUNTIME: ${{ matrix.runtime }}
        run: make "test-${LOCAL_MODEL_RUNTIME}"

  bandit:
    name: Bandit security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check bandit==1.9.4
      - name: Scan application and build code
        run: bandit --recursive --severity-level medium --confidence-level medium src/bibliosleuth_ai scripts

  dependencies:
    name: Python dependency vulnerability audit
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes --requirement requirements-runtime.txt

  codeql:
    name: CodeQL security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload CodeQL results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:python

  trivy:
    name: Trivy security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          version: v0.74.0

  qlty:
    name: Qlty code-quality pass
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Enforce correctness-oriented Ruff checks
        run: ruff check src tests scripts
      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - run: qlty check --all --no-progress --no-fix --no-fail

  package:
    name: Build and verify release package
    needs: [validate_tag, tests, searxng-integration, local-model-integration, bandit, dependencies, codeql, trivy, qlty]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Produce a GitHub-verifiable artifact attestation.
      attestations: write # Store the attestation for this repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Build deterministic package
        run: python scripts/build_plugin.py
      - name: Verify ZIP and checksum
        shell: bash
        run: |
          unzip -t dist/BiblioSleuth-AI.zip
          cd dist
          sha256sum --check BiblioSleuth-AI.zip.sha256
      - name: Generate CycloneDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/BiblioSleuth-AI.zip
          format: cyclonedx-json
          output-file: dist/BiblioSleuth-AI.cdx.json
          upload-artifact: false
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/BiblioSleuth-AI.zip
            dist/BiblioSleuth-AI.zip.sha256
            dist/BiblioSleuth-AI.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BiblioSleuth AI-${{ needs.validate_tag.outputs.version }}
          path: |
            dist/BiblioSleuth-AI.zip
            dist/BiblioSleuth-AI.zip.sha256
            dist/BiblioSleuth-AI.cdx.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [validate_tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release and upload verified assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: BiblioSleuth AI-${{ needs.validate_tag.outputs.version }}
          path: dist
      - name: Verify downloaded release assets
        run: cd dist && sha256sum --check BiblioSleuth-AI.zip.sha256
      - name: Extract versioned release notes from the changelog
        env:
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        run: >-
          python scripts/extract_release_notes.py
          --version "$RELEASE_VERSION"
          --output dist/release-notes.md
      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BiblioSleuth-AI.zip \
            dist/BiblioSleuth-AI.zip.sha256 \
            dist/BiblioSleuth-AI.cdx.json \
            --verify-tag \
            --title "BiblioSleuth AI $RELEASE_VERSION" \
            --notes-file dist/release-notes.md

  deploy-update-manifest:
    name: Deploy public update manifest
    needs: [validate_tag, release]
    runs-on: ubuntu-latest
    environment: cloudflare-updates
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Generate strict release manifest
        shell: bash
        run: |
          python scripts/generate_update_manifest.py \
            --version "$RELEASE_VERSION" \
            --published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/bibliosleuth-update-site/latest.json"
      - name: Deploy manifest to Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --yes wrangler@4.129.0 deploy
          --config wrangler.jsonc
          --assets "$RUNNER_TEMP/bibliosleuth-update-site"
          --name "$CLOUDFLARE_WORKER_NAME"
      - name: Verify the public manifest
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 10 \
                --max-filesize 4096 --proto '=https' \
                --header "Cache-Control: no-cache" \
                --output "$RUNNER_TEMP/public-latest.json" \
                https://bibliosleuthai-updates.trentathome.xyz/latest.json \
              && PYTHONPATH=src python -c \
                'import pathlib, sys; from bibliosleuth_ai.update_check import parse_manifest; manifest = parse_manifest(pathlib.Path(sys.argv[1]).read_bytes()); assert manifest.version == sys.argv[2], "public update manifest does not match the release"' \
                "$RUNNER_TEMP/public-latest.json" "$RELEASE_VERSION"; then
              echo "Verified public update manifest for $RELEASE_VERSION"
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "Public update manifest verification failed" >&2
          exit 1
