name: tagged release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_tag:
    name: Validate tag and main ancestry
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a semantic version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Require tag and plugin versions to match
        id: version
        shell: bash
        run: |
          plugin_version="$(PYTHONPATH=src python -c 'from bibliosleuth_ai import BiblioSleuthAIPlugin; from bibliosleuth_ai.constants import PLUGIN_VERSION; assert BiblioSleuthAIPlugin.version == PLUGIN_VERSION; print(".".join(map(str, PLUGIN_VERSION)))')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$plugin_version" = "$tag_version"
          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: validate_tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-runtime.txt
      - run: python -m pytest -q

  bandit:
    name: Bandit security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check bandit==1.9.4
      - name: Scan application and build code
        run: bandit --recursive --severity-level medium --confidence-level medium src/bibliosleuth_ai scripts

  dependencies:
    name: Python dependency vulnerability audit
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes --requirement requirements-runtime.txt

  codeql:
    name: CodeQL security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload CodeQL results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:python

  trivy:
    name: Trivy security scan
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          version: v0.74.0

  qlty:
    name: Qlty code-quality pass
    needs: validate_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Enforce correctness-oriented Ruff checks
        run: ruff check src tests scripts
      - uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - run: qlty check --all --no-progress --no-fix --no-fail

  package:
    name: Build and verify release package
    needs: [validate_tag, tests, bandit, dependencies, codeql, trivy, qlty]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Produce a GitHub-verifiable artifact attestation.
      attestations: write # Store the attestation for this repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Build deterministic package
        run: python scripts/build_plugin.py
      - name: Verify ZIP and checksum
        shell: bash
        run: |
          unzip -t dist/BiblioSleuth-AI.zip
          cd dist
          sha256sum --check BiblioSleuth-AI.zip.sha256
      - name: Generate CycloneDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/BiblioSleuth-AI.zip
          format: cyclonedx-json
          output-file: dist/BiblioSleuth-AI.cdx.json
          upload-artifact: false
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/BiblioSleuth-AI.zip
            dist/BiblioSleuth-AI.zip.sha256
            dist/BiblioSleuth-AI.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BiblioSleuth AI-${{ needs.validate_tag.outputs.version }}
          path: |
            dist/BiblioSleuth-AI.zip
            dist/BiblioSleuth-AI.zip.sha256
            dist/BiblioSleuth-AI.cdx.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [validate_tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release and upload verified assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: BiblioSleuth AI-${{ needs.validate_tag.outputs.version }}
          path: dist
      - name: Verify downloaded release assets
        run: cd dist && sha256sum --check BiblioSleuth-AI.zip.sha256
      - name: Extract versioned release notes from the changelog
        env:
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        run: >-
          python scripts/extract_release_notes.py
          --version "$RELEASE_VERSION"
          --output dist/release-notes.md
      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BiblioSleuth-AI.zip \
            dist/BiblioSleuth-AI.zip.sha256 \
            dist/BiblioSleuth-AI.cdx.json \
            --verify-tag \
            --title "BiblioSleuth AI $RELEASE_VERSION" \
            --notes-file dist/release-notes.md
